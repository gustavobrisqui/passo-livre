# Passo Livre — pipeline DevSecOps.
# Em todo push/PR: segredos (Gitleaks) + SAST (Semgrep) + testes + IaC (Trivy config) em paralelo,
# depois build e varredura das imagens (Trivy). Só na main: publica no GHCR, faz deploy na Azure
# (OIDC, sem segredo de longa duração) e testa a URL pública.
name: ci-cd

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/gustavobrisqui
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks em todo o histórico
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose --exit-code 1 --config /repo/.gitleaks.toml .

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep (regras ci, python, dockerfile, javascript, secrets)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.185.0 semgrep scan \
            --config p/ci --config p/python --config p/dockerfile --config p/javascript --config p/secrets \
            --error --metrics=off --exclude web/vendor .

  testes:
    name: Testes da API (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  iac:
    name: IaC e Dockerfiles (Trivy config)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy config (Terraform + Dockerfiles + compose)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ env.TRIVY_IMAGE }} config \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs web/vendor .
      - name: Terraform fmt e validate
        run: |
          TF="docker run --rm -v $PWD:/src -w /src/infra/terraform hashicorp/terraform:1.17.2"
          $TF fmt -check -recursive
          $TF init -backend=false -input=false >/dev/null
          $TF validate

  build:
    name: Build + Trivy (imagens)
    needs: [gitleaks, semgrep, testes, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: web
            contexto: .
          - nome: api
            contexto: ./api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build da imagem ${{ matrix.nome }}
        run: |
          docker build --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t $REGISTRY/passo-livre-${{ matrix.nome }}:${GITHUB_SHA::7} ${{ matrix.contexto }}
      - name: Trivy — barra vulnerabilidades HIGH/CRITICAL com correção disponível
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ${{ env.TRIVY_IMAGE }} image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            $REGISTRY/passo-livre-${{ matrix.nome }}:${GITHUB_SHA::7}
      - name: Publica no GHCR (somente main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag $REGISTRY/passo-livre-${{ matrix.nome }}:${GITHUB_SHA::7} $REGISTRY/passo-livre-${{ matrix.nome }}:latest
          docker push $REGISTRY/passo-livre-${{ matrix.nome }}:${GITHUB_SHA::7}
          docker push $REGISTRY/passo-livre-${{ matrix.nome }}:latest

  deploy:
    name: Deploy na Azure (OIDC + run-command)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login na Azure via OIDC (sem senha armazenada)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Atualiza a VM (compose + imagens da versão ${{ github.sha }})
        run: |
          TAG=${GITHUB_SHA::7}
          az vm run-command invoke -g "${{ vars.AZURE_RG }}" -n "${{ vars.AZURE_VM }}" \
            --command-id RunShellScript --query "value[0].message" -o tsv --scripts "
              set -e
              cd /opt/passolivre
              curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml -o docker-compose.yml.novo
              mv docker-compose.yml.novo docker-compose.yml
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env
              docker compose pull -q
              docker compose up -d --remove-orphans
              docker image prune -f >/dev/null
              docker compose ps --format '{{.Service}} {{.Status}}'
            "
      - name: Smoke test na URL pública
        run: |
          TAG=${GITHUB_SHA::7}
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/version" | grep -q "\"$TAG\""; then
              curl -fsS "${{ vars.APP_URL }}/healthz"
              curl -fsS -o /dev/null -w "pagina inicial: %{http_code}\n" "${{ vars.APP_URL }}/"
              echo "Versão $TAG no ar."; exit 0
            fi
            sleep 10
          done
          echo "A versão $TAG não respondeu em ${{ vars.APP_URL }}"; exit 1
