# Envia os alertas para um canal do Discord. A URL do webhook fica em
# observability/secrets/discord_webhook (ignorado pelo Git). Sem ela, o alerta continua
# visível como FIRING no Prometheus, no Alertmanager e no painel do Grafana.
route:
  receiver: discord
  group_by: [alertname, alvo]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥 ALERTA{{ else }}✅ RESOLVIDO{{ end }}: {{ .CommonLabels.alertname }} ({{ .CommonLabels.alvo }})'
        message: '{{ range .Alerts }}{{ .Annotations.resumo }} — {{ .Annotations.descricao }}{{ "\n" }}{{ end }}'
